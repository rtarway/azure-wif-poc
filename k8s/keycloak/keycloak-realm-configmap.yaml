apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  azure-wif-realm.json: |
    {
      "realm": "azure-wif-realm",
      "enabled": true,
      "displayName": "Azure Workload Identity Federation & Agentic Flow Realm",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Administrator with full access to tool1 and tool2 in MCP"
          },
          {
            "name": "regular-user",
            "description": "Regular user restricted to tool1 in MCP"
          }
        ]
      },
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@example.com",
          "firstName": "Alice",
          "lastName": "Administrator",
          "credentials": [
            {
              "type": "password",
              "value": "alicepassword",
              "temporary": false
            }
          ],
          "realmRoles": [
            "admin"
          ]
        },
        {
          "username": "bob",
          "enabled": true,
          "email": "bob@example.com",
          "firstName": "Bob",
          "lastName": "Operator",
          "credentials": [
            {
              "type": "password",
              "value": "bobpassword",
              "temporary": false
            }
          ],
          "realmRoles": [
            "regular-user"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "mcp:tool1",
          "description": "Scope permitting access to tool1 (app1 and app2 read/write)",
          "protocol": "openid-connect"
        },
        {
          "name": "mcp:tool2",
          "description": "Scope permitting access to tool2 (app1 read-only audit)",
          "protocol": "openid-connect"
        }
      ],
      "clients": [
        {
          "clientId": "web-frontend-client",
          "name": "Web Frontend Application",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://localhost:3000/*",
            "http://127.0.0.1:3000/*"
          ],
          "webOrigins": [
            "*"
          ],
          "defaultClientScopes": [
            "web-origins",
            "roles",
            "profile",
            "email"
          ]
        },
        {
          "clientId": "mcp-azure-service",
          "name": "Azure MCP Resource Service",
          "enabled": true,
          "bearerOnly": true,
          "protocol": "openid-connect"
        }
      ]
    }
