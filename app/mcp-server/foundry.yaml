# Microsoft Foundry (Azure AI Foundry) Project Tool Manifest
# Defines the Low-Code MCP Service runtime and tool registrations for Microsoft Foundry
name: azure-mcp-server
version: 1.0.0
protocol: mcp
protocol_version: "2026-07-15"

foundry:
  project: proj-azure-wif-mcp
  hub: hub-azure-wif-foundry
  service_type: custom-mcp-tool-service

runtime:
  language: nodejs
  version: "20"
  entrypoint: src/index.js
  port: 8080

environment:
  MCP_PROTOCOL_VERSION: "2026-07-15"
  AZURE_STORAGE_ACCOUNT: "storagewifdemo"

tools:
  declarative_spec: tools.yaml
