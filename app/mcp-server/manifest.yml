---
# Cloud Foundry Application Manifest for Azure MCP Server
# Deploy via: cf push -f manifest.yml
applications:
  - name: azure-mcp-server
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpack: nodejs_buildpack
    command: npm start
    routes:
      - route: azure-mcp-server.apps.azure.example.com
    env:
      NODE_ENV: production
      PORT: 8080
      MCP_PROTOCOL_VERSION: "2026-07-15"
      AZURE_STORAGE_ACCOUNT: "azwifstoragepoc"
      JWT_SECRET: "demo-obo-token-secret-key-2026"
      JWT_ISSUER: "https://identity.example.com/realms/azure-wif-realm"
    services:
      # Bound Azure Storage Service instance (e.g. from Azure Service Broker or cups)
      - azure-storage-binding
