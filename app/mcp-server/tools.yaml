# Low-Code Declarative MCP Tool Registry
# Tools are defined declaratively without writing imperative routing boilerplate.
# The MCP declarative engine automatically registers tools, enforces JSON schemas,
# evaluates required OAuth scopes, and dispatches storage operations.

version: "2026-07-15"
tools:
  - name: "tool1"
    title: "Storage Read/Write Tool for App1 and App2"
    description: "Allows reading and writing blobs in Azure Storage containers app1 and app2. Permitted for regular users and administrators with mcp:tool1 scope."
    required_scope: "mcp:tool1"
    target_backend: "azure_storage"
    allowed_containers:
      - "app1"
      - "app2"
    allowed_actions:
      - "read"
      - "write"
    inputSchema:
      type: "object"
      properties:
        container:
          type: "string"
          enum: ["app1", "app2"]
          description: "Target Azure Blob Storage container"
        action:
          type: "string"
          enum: ["read", "write"]
          description: "Storage action to perform"
        filename:
          type: "string"
          description: "Name of the blob file"
        content:
          type: "string"
          description: "Data content to write (required if action is write)"
      required:
        - "container"
        - "action"
        - "filename"
    fine_grained_policies:
      - id: "prevent_audit_tampering"
        description: "Prevents modifying compliance or audit files"
        effect: "DENY"
        condition: "args.action == 'write' && (args.filename.includes('compliance') || args.filename.includes('audit'))"
        message: "Fine-Grained Policy Denial: Compliance and audit records are immutable and cannot be overwritten."
      - id: "restricted_extensions"
        description: "Enforce allowed data file extensions"
        effect: "DENY"
        condition: "!args.filename.endsWith('.json') && !args.filename.endsWith('.txt') && !args.filename.endsWith('.yaml')"
        message: "Fine-Grained Policy Denial: Only .json, .txt, and .yaml files are permitted."

  - name: "tool2"
    title: "Auditing & Read-Only Tool for App1"
    description: "Provides read-only access strictly to the app1 container for system audits and management. Restricted to administrators with mcp:tool2 scope."
    required_scope: "mcp:tool2"
    target_backend: "azure_storage"
    allowed_containers:
      - "app1"
    allowed_actions:
      - "read"
    inputSchema:
      type: "object"
      properties:
        container:
          type: "string"
          enum: ["app1"]
          description: "Target Azure Blob Storage container (app1 only)"
        action:
          type: "string"
          enum: ["read"]
          description: "Storage action (strictly read)"
        filename:
          type: "string"
          description: "Name of the blob file to read"
      required:
        - "container"
        - "action"
        - "filename"
    fine_grained_policies:
      - id: "block_private_keys"
        description: "Prevents reading private key or credential blobs"
        effect: "DENY"
        condition: "args.filename.includes('key') || args.filename.includes('secret') || args.filename.includes('cred')"
        message: "Fine-Grained Policy Denial: Access to credential or private key files is strictly prohibited."

  - name: "send_email_graph"
    title: "Microsoft Graph Email Dispatch Tool"
    description: "Dispatches an email via Microsoft Graph API v1.0 /me/sendMail with delegated RFC 8693 token. Permitted for users with Mail.Send scope."
    required_scope: "Mail.Send"
    target_backend: "microsoft_graph"
    inputSchema:
      type: "object"
      properties:
        recipient:
          type: "string"
          description: "Target email recipient (strictly restricted to rtarway@gmail.com)"
        subject:
          type: "string"
          description: "Email subject line"
        body:
          type: "string"
          description: "Redacted message content"
      required:
        - "recipient"
        - "subject"
        - "body"
    fine_grained_policies:
      - id: "enforce_fixed_recipient"
        description: "Enforces that emails can only be sent to authorized fixed recipient rtarway@gmail.com"
        effect: "DENY"
        condition: "args.recipient !== 'rtarway@gmail.com'"
        message: "Fine-Grained Policy Denial: Outbound emails are restricted strictly to rtarway@gmail.com."

